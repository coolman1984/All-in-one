<!DOCTYPE html>
<html lang="ar" dir="ltr">
<head>
<meta charset="utf-8">
<title>experiment</title>
<style>
  html, body { margin: 0; height: 100%; font: 13px "Segoe UI", sans-serif; overflow: hidden; }
  #bar { height: 28px; background: #f3f3f3; border-bottom: 1px solid #ddd; padding: 4px 8px; box-sizing: border-box; }
  #main { display: flex; height: calc(100% - 28px); }
  #side { width: 180px; border-inline-end: 1px solid #ddd; padding: 6px; box-sizing: border-box; }
  #side div { padding: 4px; }
  #host { position: relative; flex: 1; min-width: 0; }
  #scroll { position: absolute; inset: 0; overflow: auto; }
  #tall { width: 1px; }
  canvas { position: absolute; inset: 0; pointer-events: none; }
</style>
</head>
<body>
<div id="bar">ملف &nbsp; بحث</div>
<div id="main">
  <div id="side"><div>الوارد</div><div>الجداول</div><div>الملاحظات</div></div>
  <div id="host"><div id="scroll"><div id="tall"></div></div><canvas id="c"></canvas></div>
</div>
<script>
// A small hand-made canvas grid: it draws only what is on screen and asks the host for one screen of rows at a time.
const ROWS = 1000000, COLS = 20, RH = 22, HEAD = 24, CW = 110, RHW = 70;
const host = document.getElementById('host'), cv = document.getElementById('c'), scroll = document.getElementById('scroll'), tall = document.getElementById('tall');
const ctx = cv.getContext('2d', { alpha: false });
const wv = window.chrome && window.chrome.webview;
let rtl = false, tableOn = false, nextId = 1; const waiting = new Map();

// Outside WebView2 (plain Chrome test) the rows are made here, with the same shapes as shared/Synth.cs.
const P = ["مخزن القاهرة", "Cairo Store", "مصنع ٦ أكتوبر", "Line B - خط ب", "الإسكندرية", "Plant 7", "مخزن رقم 12", "Giza Hub"];
const I = ["مسمار صلب 10 مم", "Steel bolt M8", "غطاء بلاستيك", "Cable 2.5 mm", "محرك صغير", "Valve A-17", "لوحة تحكم", "Bearing 6204"];
function localCell(r, c) {
  let h = (Math.imul(r, 2654435761) ^ Math.imul(c, 40503)) >>> 0; h ^= h >>> 13; h = Math.imul(h, 2246822519) >>> 0; h ^= h >>> 16; h >>>= 0;
  switch (c % 5) {
    case 0: return String(100000 + r);
    case 1: return P[h % 8];
    case 2: return I[(h >>> 3) % 8];
    case 3: return ((h % 10000000) / 100).toFixed(2);
    default: return '2026-' + String(1 + h % 12).padStart(2, '0') + '-' + String(1 + (h >>> 5) % 28).padStart(2, '0');
  }
}
function say(s) {
  if (wv) wv.postMessage({ t: 'say', s });
  else fetch('/report', { method: 'POST', body: s });
}
function rows(from, n) {
  if (!wv) { const out = []; for (let r = from; r < Math.min(ROWS, from + n); r++) { const a = []; for (let c = 0; c < COLS; c++) a.push(localCell(r, c)); out.push(a); } return Promise.resolve(out); }
  return new Promise(res => { const id = nextId++; waiting.set(id, res); wv.postMessage({ t: 'rows', id, from, n }); });
}
if (wv) wv.addEventListener('message', e => { const m = e.data; if (m.t === 'rows') { const f = waiting.get(m.id); waiting.delete(m.id); f(m.rows); } });

function size() {
  const d = window.devicePixelRatio || 1, w = host.clientWidth, h = host.clientHeight;
  cv.width = w * d; cv.height = h * d; cv.style.width = w + 'px'; cv.style.height = h + 'px'; ctx.setTransform(d, 0, 0, d, 0, 0);
}
function draw(first, data) {
  const w = host.clientWidth, h = host.clientHeight;
  ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, w, h);
  ctx.font = '13px "Segoe UI"'; ctx.textBaseline = 'middle'; ctx.direction = rtl ? 'rtl' : 'ltr'; ctx.textAlign = rtl ? 'right' : 'left';
  const X = i => rtl ? w - RHW - i * CW - 6 : RHW + i * CW + 6;
  ctx.fillStyle = '#f3f3f3'; ctx.fillRect(0, 0, w, HEAD); ctx.fillStyle = '#333';
  for (let c = 0; c < COLS; c++) ctx.fillText('C' + (c + 1), X(c), HEAD / 2);
  ctx.strokeStyle = '#e4e4e4'; ctx.beginPath();
  for (let i = 0; i < data.length; i++) {
    const y = HEAD + i * RH;
    ctx.fillStyle = '#777'; ctx.fillText(String(first + i + 1), rtl ? w - 6 : 6, y + RH / 2);
    ctx.fillStyle = '#111';
    for (let c = 0; c < COLS; c++) ctx.fillText(data[i][c], X(c), y + RH / 2);
    ctx.moveTo(0, y + RH + .5); ctx.lineTo(w, y + RH + .5);
  }
  ctx.stroke();
}
// Reading one pixel forces the drawing to really finish, so the time is not just the queueing of commands.
function finish() { ctx.getImageData(0, 0, 1, 1); }
async function show(first) { const n = Math.ceil(host.clientHeight / RH) + 1, data = await rows(first, n); draw(first, data); finish(); }
function loadTable() {
  const t = performance.now();
  tall.style.height = (ROWS * RH + HEAD) + 'px'; tableOn = true;
  show(0).then(() => say('TABLE_READY ' + (performance.now() - t).toFixed(1)));
}
scroll.addEventListener('scroll', () => { if (tableOn) show(Math.floor(scroll.scrollTop / RH)); });

function mulberry(a) { return () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
async function bench() {
  const rnd = mulberry(3), t = [];
  for (let i = 0; i < 200; i++) { const a = performance.now(); await show(Math.floor(rnd() * (ROWS - 40))); t.push(performance.now() - a); }
  t.sort((a, b) => a - b); const jump = `jump_med=${t[100].toFixed(2)} jump_p95=${t[190].toFixed(2)}`;
  t.length = 0; let row = 0;
  for (let i = 0; i < 200; i++) { const a = performance.now(); row += 3; await show(row); t.push(performance.now() - a); }
  t.sort((a, b) => a - b); say(`BENCH ${jump} wheel_med=${t[100].toFixed(2)} wheel_p95=${t[190].toFixed(2)}`);
}
function setRtl() { rtl = true; document.documentElement.dir = 'rtl'; size(); show(0); }

size(); ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, 1, 1); finish();
addEventListener('resize', () => { size(); if (tableOn) show(Math.floor(scroll.scrollTop / RH)); });
setTimeout(() => say('READY'), 0);

// Plain Chrome test: the watcher drives the page with a query string, since it has no stdin.
if (!wv && location.search.includes('auto')) {
  const wait = ms => new Promise(r => setTimeout(r, ms));
  (async () => { for (;;) { const r = await fetch('/next'); const c = await r.text(); if (c === 'table') loadTable(); else if (c === 'bench') await bench(); else if (c === 'rtl') { setRtl(); await wait(300); say('RTL_DONE'); } else if (c === 'quit') return; else await wait(100); } })();
}
</script>
</body>
</html>
